<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b3d91" />
  <title>Triple Jump 43-Foot Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1 id="appTitle">👟 Triple Jump 43-Foot Tracker</h1>
      <p id="status" class="status"></p>
      <div class="goal">
        <div class="bar goalbar" aria-hidden="true"><div id="goalFill" class="fill"></div></div>
        <p id="goalText" class="goal-text"></p>
      </div>
    </div>
  </header>

  <nav class="tabs wrap" aria-label="Main">
    <button id="tab-week" class="tab" aria-current="page">Training</button>
    <button id="tab-progress" class="tab">Progress</button>
  </nav>

  <main id="app" class="wrap"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="plan.js"></script>
  <script src="app.js"></script>
</body>
</html>
